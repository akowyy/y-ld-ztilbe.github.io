<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonsuz Kumsal Yürüyüşü</title>
    <style>
        /* Sayfa yapısı */
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: linear-gradient(to bottom, #87CEEB, #ffffff);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        /* Yürünecek zemin (Kumsal ve çizgiler) */
        .beach {
            position: absolute;
            bottom: 0;
            width: 200%;
            height: 150px;
            /* Kum efekti ve çizgiler */
            background: repeating-linear-gradient(
                90deg, 
                #F4A460, 
                #F4A460 100px, 
                #E3924D 100px, 
                #E3924D 200px
            );
            /* Animasyon: Sonsuza kadar sola kaydır */
            animation: moveBeach 4s linear infinite;
        }

        /* Karakterler */
        .people {
            position: absolute;
            bottom: 120px;
            z-index: 10;
            font-size: 60px;
            /* Hafif zıplama efekti */
            animation: bounce 0.5s infinite alternate;
        }

        /* Zemin hareket animasyonu */
        @keyframes moveBeach {
            from { transform: translateX(0); }
            to { transform: translateX(-200px); }
        }

        /* Karakterler için basit bir yürüme zıplaması */
        @keyframes bounce {
            from { bottom: 120px; }
            to { bottom: 135px; }
        }
    </style>
</head>
<body>

    <div class="people">👫</div>
    <div class="beach"></div>

</body>
</html>
