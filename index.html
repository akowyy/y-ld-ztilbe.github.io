<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Sonsuz Yürüyüş</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: linear-gradient(to bottom, #87CEEB, #ffffff);
            height: 100vh;
        }

        /* Deniz ve Yol katmanı */
        .scenery {
            position: absolute;
            bottom: 0;
            width: 200%;
            height: 200px;
            background: linear-gradient(to right, #1E90FF, #00BFFF, #1E90FF);
            animation: moveBackground 10s linear infinite;
        }

        /* Yürüyen karakterler */
        .people {
            position: absolute;
            bottom: 150px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 50px;
        }

        /* Sonsuz döngü animasyonu */
        @keyframes moveBackground {
            from { transform: translateX(0); }
            to { transform: translateX(-50%); }
        }
    </style>
</head>
<body>

    <div class="people">👫</div>
    <div class="scenery"></div>

</body>
</html>
