<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonsuz Yürüyüş</title>
    <style>
        body { 
            margin: 0; padding: 0; overflow: hidden; 
            background: linear-gradient(to bottom, #87CEEB, #ffffff); 
            height: 100vh; display: flex; justify-content: center; 
            align-items: flex-end; position: relative; 
        }

        /* 1. Arka Plan (Bulutlar) */
        .background-scenery { 
            position: absolute; top: 0; left: 0; width: 200%; height: 100%; 
            background-image: radial-gradient(circle at 10% 20%, white 20px, transparent 21px), 
                              radial-gradient(circle at 50% 25%, white 25px, transparent 26px),
                              radial-gradient(circle at 80% 15%, white 35px, transparent 36px);
            background-size: 1000px 100%; 
            animation: moveBackground 40s linear infinite; z-index: 0; 
        }

        /* 2. Zemin (Kumsal) */
        .ground { 
            position: absolute; bottom: 0; left: 0; width: 200%; height: 100px; 
            background: repeating-linear-gradient(90deg, #F4A460, #F4A460 100px, #E3924D 100px, #E3924D 200px);
            animation: moveGround 3s linear infinite; z-index: 1; 
        }

        /* 3. Karakter Konteynırı (Sabit Pozisyon) */
        .characters { 
            position: absolute; bottom: 85px; z-index: 2; 
            animation: walkCycle 0.5s infinite alternate; 
        }

        /* Animasyonlar */
        @keyframes moveBackground { from { transform: translateX(0); } to { transform: translateX(-500px); } }
        @keyframes moveGround { from { transform: translateX(0); } to { transform: translateX(-200px); } }
        @keyframes walkCycle { 0% { transform: translateY(0); } 100% { transform: translateY(-15px); } }
    </style>
</head>
<body>

    <div class="background-scenery"></div>

    <div class="characters">
        <svg width="150" height="120" viewBox="0 0 150 120">
            <rect x="10" y="40" width="45" height="50" fill="white" stroke="black" stroke-width="3"/>
            <circle cx="32.5" cy="25" r="15" fill="peachpuff" stroke="black" stroke-width="3"/>
            
            <rect x="70" y="40" width="45" height="50" fill="black" stroke="black" stroke-width="3"/>
            <circle cx="92.5" cy="25" r="15" fill="peachpuff" stroke="black" stroke-width="3"/>
        </svg>
    </div>

    <div class="ground"></div>

</body>
</html>
